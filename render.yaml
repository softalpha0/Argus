# One Render web service: the server serves the API, the live socket and the built web app.
services:
  - type: web
    name: argus
    runtime: node
    plan: free               # sleeps after 15 min idle, no disk; see README for an always-on setup
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: STRIKE_ENV
        value: testnet
      - key: SYMBOL
        value: BTC-USD
      - key: ARGUS_FEE_BPS
        value: "2"
      - key: BUILDER_MAX_FEE_BPS
        value: "10"
      - key: BUILDER_CODE
        sync: false          # set in the Render dashboard: Argus on testnet, argus on mainnet
      - key: ARGUS_MASTER_KEY
        sync: false          # 64 hex chars; generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
